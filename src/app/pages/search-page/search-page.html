<mat-card appearance="outlined" class="card search-card">
  <mat-card-header>
    <mat-card-title>Search for Flashcards</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field>
      <mat-label>Search</mat-label>
      <input
        matInput
        type="text"
        placeholder="Search flashcards..."
        [(ngModel)]="searchQuery"
        name="searchQuery"
      />
    </mat-form-field>
  </mat-card-content>
</mat-card>

@if (hasQuery()) {
  <section class="search-results" aria-live="polite">
    <p>{{ results().length }} result{{ results().length === 1 ? "" : "s" }} found</p>

    @if (results().length) {
      @for (card of results(); track card.id) {
        <flash-card
          [cardId]="card.id"
          [question]="card.question"
          [answer]="card.answer"
          class="skinny"
        />
      }
    } @else {
      <p>No flash cards match “{{ searchQuery() }}”.</p>
    }
  </section>
}
