@if (card(); as currentCard) {
  <article class="card-detail-page">
    <button type="button" matButton="tonal" (click)="goBack()" class="back-link">
      <mat-icon>arrow_back</mat-icon> Back
    </button>

    <mat-card appearance="outlined" class="article-card">
      <mat-card-header>
        <div class="article-heading">
          <span class="category">{{ currentCard.category }}</span>
          <mat-card-title>
            <h1>{{ currentCard.question }}</h1></mat-card-title
          >
        </div>
        <favourite-button [cardId]="currentCard.id" />
      </mat-card-header>

      <mat-card-content>
        <p class="article-label">Answer</p>
        <p class="article-answer">{{ currentCard.answer }}</p>
      </mat-card-content>

      @if (currentCard.editorial) {
        <mat-card-content class="editorial-content">
          <p class="article-label">Editorial</p>
          <p class="article-editorial">{{ currentCard.editorial }}</p>
        </mat-card-content>
      }
    </mat-card>
  </article>
} @else {
  <article class="card-detail-page">
    <mat-card appearance="outlined" class="article-card">
      <mat-card-header class="article-heading">
        <mat-card-title>Sorry, your flash card was not found</mat-card-title>
      </mat-card-header>
      <mat-card-content class="editorial-content">
        <p class="article-editorial">That flash card does not exist.</p>
        <button type="button" matButton="tonal" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Return to flash cards
        </button>
      </mat-card-content>
    </mat-card>
  </article>
}
