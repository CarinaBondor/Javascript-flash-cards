<section class="topic-page" aria-labelledby="topic-title">
  <header>
    <p class="eyebrow">Study deck</p>
    <h1 id="topic-title">{{ title }}</h1>
    <p>{{ cards.length }} {{ cards.length === 1 ? "card" : "cards" }} in this topic</p>
  </header>

  @if (cards.length) {
    <app-flash-cards-holder [deck]="category" />
  } @else {
    <p class="empty-state">No cards are available for this topic yet.</p>
  }
</section>
