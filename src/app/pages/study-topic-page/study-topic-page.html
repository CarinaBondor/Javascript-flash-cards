<section class="study-page" aria-labelledby="study-title">
  <h1 id="study-title" class="visually-hidden">Study: {{ title }}</h1>

  <nav class="deck-switch" aria-label="Choose a deck">
    @for (link of deckLinks; track link.topic) {
      <a
        [routerLink]="link.path"
        [attr.data-topic]="link.topic"
        [attr.aria-current]="link.topic === category ? 'page' : null"
      >
        {{ link.label }} <span class="count">{{ link.count }}</span>
      </a>
    }
  </nav>

  @if (cards.length) {
    <app-flash-cards-holder [deck]="category" />
  } @else {
    <p class="empty-state">There are no cards in this deck yet. Pick another deck above.</p>
  }
</section>
