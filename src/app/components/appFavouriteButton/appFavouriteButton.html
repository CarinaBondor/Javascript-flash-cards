<button
  matIconButton
  type="button"
  class="favourite-button"
  [class.is-favourite]="isFavourite()"
  [attr.aria-label]="isFavourite() ? 'Remove from favourites' : 'Add to favourites'"
  [attr.aria-pressed]="isFavourite()"
  (click)="toggleFavourite()"
>
  <mat-icon aria-hidden="true" [class.is-filled]="isFavourite()">favorite</mat-icon>
</button>
