<mat-card appearance="outlined" class="card">
  <mat-card-header>
    <mat-card-title>Favourited cards</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (favouritedCards().length === 0) {
      <p>You have no favourited cards.</p>
    } @else {
      <p>Total favourites: {{ favouritedCards().length }}</p>

      <div class="favourited-cards">
        @for (card of favouritedCards(); track card.id) {
          <flash-card
            [cardId]="card.id"
            [question]="card.question"
            [answer]="card.answer"
            class="skinny"
          />
        }
      </div>
    }
  </mat-card-content>
</mat-card>
