<mat-card appearance="outlined" class="card">
  <mat-card-header>
    <mat-card-title>Search for Flashcards</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field>
      <mat-label>Search</mat-label>
      <input
        matInput
        type="text"
        placeholder="Search flashcards..."
        [(ngModel)]="searchQuery"
        name="searchQuery"
      />
    </mat-form-field>
  </mat-card-content>
</mat-card>
