<mat-card appearance="outlined" class="card">
  <h1>Search for Flashcards</h1>
  <mat-form-field>
    <mat-label>Search</mat-label>
    <input
      matInput
      type="text"
      placeholder="Search flashcards..."
      [(ngModel)]="searchQuery"
      name="searchQuery"
    />
  </mat-form-field>
</mat-card>
