<header class="top-bar">
  <a class="brand" routerLink="/">
    <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
    Flash Cards
  </a>

  <nav class="top-nav" aria-label="Primary">
    @for (item of items; track item.path) {
      <a
        matButton
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: item.exact }"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <button
    matIconButton
    class="theme-button"
    [matMenuTriggerFor]="themeMenu"
    [attr.aria-label]="'Colour theme: ' + currentTheme().label"
  >
    <mat-icon aria-hidden="true">{{ currentTheme().icon }}</mat-icon>
  </button>

  <mat-menu #themeMenu="matMenu" xPosition="before">
    @for (option of themeOptions; track option.mode) {
      <button
        mat-menu-item
        role="menuitemradio"
        [attr.aria-checked]="option.mode === theme.mode()"
        (click)="theme.setMode(option.mode)"
      >
        <mat-icon aria-hidden="true">{{ option.icon }}</mat-icon>
        <span>{{ option.label }}</span>
        @if (option.mode === theme.mode()) {
          <mat-icon class="selected" aria-hidden="true">check</mat-icon>
        }
      </button>
    }
  </mat-menu>
</header>

<nav class="bottom-nav" aria-label="Primary">
  @for (item of items; track item.path) {
    <a
      class="bottom-link"
      [routerLink]="item.path"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: item.exact }"
    >
      <span class="pill"
        ><mat-icon aria-hidden="true">{{ item.icon }}</mat-icon></span
      >
      {{ item.label }}
    </a>
  }
</nav>
