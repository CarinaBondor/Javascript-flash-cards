<nav class="wrapper" aria-label="Primary navigation">
  <mat-toolbar class="desktop-toolbar">
    <ul>
      <li><a mat-button routerLink="/" routerLinkActive="active">Home</a></li>
      <li><a mat-button routerLink="/about" routerLinkActive="active">About</a></li>
      <li><a mat-button routerLink="/search" routerLinkActive="active">Search</a></li>
      <li><a mat-button routerLink="/favourites" routerLinkActive="active">Favourites</a></li>
    </ul>
  </mat-toolbar>

  <mat-sidenav-container class="mobile-navigation" [class.sidenav-open]="sidenavOpened()">
    <mat-sidenav #sidenav mode="over" class="mobile-sidenav">
      <button
        matIconButton
        aria-label="Close menu"
        (click)="sidenav.close(); sidenavOpened.set(false)"
      >
        <mat-icon>close</mat-icon>
      </button>

      <div class="sidenav-links">
        <a
          mat-button
          routerLink="/"
          routerLinkActive="active"
          (click)="sidenav.close(); sidenavOpened.set(false)"
        >
          Home
        </a>
        <a
          mat-button
          routerLink="/about"
          routerLinkActive="active"
          (click)="sidenav.close(); sidenavOpened.set(false)"
        >
          About
        </a>
        <a
          mat-button
          routerLink="/search"
          routerLinkActive="active"
          (click)="sidenav.close(); sidenavOpened.set(false)"
        >
          Search
        </a>
        <a
          mat-button
          routerLink="/favourites"
          routerLinkActive="active"
          (click)="sidenav.close(); sidenavOpened.set(false)"
        >
          Favourites
        </a>
      </div>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar class="mobile-toolbar">
        <button
          matIconButton
          aria-label="Open menu"
          (click)="sidenav.open(); sidenavOpened.set(true)"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <span>JavaScript Flash Cards</span>
      </mat-toolbar>
    </mat-sidenav-content>
  </mat-sidenav-container>
</nav>
