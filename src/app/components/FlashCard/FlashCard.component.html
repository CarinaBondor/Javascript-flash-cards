<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      <h2>{{ question() }}</h2>
    </mat-card-title>
    <mat-card-actions>
      <favourite-button />
    </mat-card-actions>
  </mat-card-header>

  <mat-card-actions>
    <button (click)="toggleAnswer()">
      {{ showAnswer ? 'Hide answer' : 'Show answer' }}
    </button>
  </mat-card-actions>

  @if (showAnswer) {
    <mat-card-content>
      <p>{{ answer() }}</p>
    </mat-card-content>
  }
</mat-card>
