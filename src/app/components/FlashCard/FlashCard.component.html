<mat-card appearance="outlined" class="flash-card">
  <mat-card-header>
    <mat-card-title>
      <h2>{{ question() }}</h2>
    </mat-card-title>
    <favourite-button [cardId]="cardId()" />
  </mat-card-header>

  <mat-card-actions>
    <button matFab extended (click)="toggleAnswer()">
      {{ showAnswer() ? 'Hide answer' : 'Show answer' }}
    </button>
    <a matButton [routerLink]="['/question', cardId()]">
      <mat-icon>open_in_new</mat-icon>
      Read full card
    </a>
  </mat-card-actions>

  <mat-card-content [class.expanded]="showAnswer()">
    <p>{{ answer() }}</p>
  </mat-card-content>
</mat-card>
