<div class="flash-cards-holder">
  <button matFab extended class="btn btn-navigation" (click)="previousCard()">
    <mat-icon>chevron_left</mat-icon>
    Previous
  </button>

  @if (currentCard) {
    <flash-card [question]="currentCard.question" [answer]="currentCard.answer" />
  }

  <button matFab extended class="btn btn-navigation" (click)="nextCard()">
    <mat-icon>chevron_right</mat-icon>
    Next
  </button>
</div>
