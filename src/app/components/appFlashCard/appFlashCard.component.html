<div class="flash" [class.is-flipped]="showAnswer()">
  <div class="face front" [attr.inert]="showAnswer() ? '' : null">
    <ng-container *ngTemplateOutlet="faceHead" />
    <h2 class="question">{{ card().question }}</h2>
    <div class="face-actions">
      <button #showAnswerButton matButton="filled" class="flip-button" (click)="toggleAnswer()">
        <mat-icon aria-hidden="true">flip</mat-icon>
        Show answer
      </button>
    </div>
  </div>

  <div class="face back" [attr.inert]="showAnswer() ? null : ''" aria-live="polite">
    <ng-container *ngTemplateOutlet="faceHead" />
    <p class="question-small">{{ card().question }}</p>
    <p class="answer">{{ card().answer }}</p>
    <div class="face-actions">
      <button #showQuestionButton matButton="tonal" class="flip-button" (click)="toggleAnswer()">
        <mat-icon aria-hidden="true">flip</mat-icon>
        Show question
      </button>
      @if (showExtras()) {
        <a matButton [routerLink]="['/question', card().id]">
          <mat-icon aria-hidden="true">article</mat-icon>
          Read the full card
        </a>
      }
    </div>
  </div>
</div>

<ng-template #faceHead>
  <div class="face-head">
    <span class="topic-chip">{{ topicLabel() }}</span>
    <span class="level">{{ card().level | titlecase }}</span>
    @if (showExtras()) {
      <app-favourite-button class="favourite" [cardId]="card().id" />
    }
  </div>
</ng-template>
