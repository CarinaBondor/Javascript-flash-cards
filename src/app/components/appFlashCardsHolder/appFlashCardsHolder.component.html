<div class="flash-cards-holder">
  <button
    matFab
    extended
    class="btn btn-navigation desktop-navigation"
    [disabled]="currentIndex() === 0"
    (click)="previousCard()"
  >
    <mat-icon>chevron_left</mat-icon>
    Previous
  </button>

  <button
    matFab
    class="btn btn-navigation mobile-navigation"
    aria-label="Previous card"
    [disabled]="currentIndex() === 0"
    (click)="previousCard()"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>

  @if (currentCard(); as card) {
    <app-flash-card
      [class.card-changing]="isAnimating()"
      [cardId]="card.id"
      [question]="card.question"
      [answer]="card.answer"
    />
  }

  <button
    matFab
    extended
    class="btn btn-navigation desktop-navigation"
    [disabled]="currentIndex() === cards().length - 1"
    (click)="nextCard()"
  >
    <mat-icon>chevron_right</mat-icon>
    Next
  </button>

  <button
    matFab
    class="btn btn-navigation mobile-navigation"
    aria-label="Next card"
    [disabled]="currentIndex() === cards().length - 1"
    (click)="nextCard()"
  >
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>
